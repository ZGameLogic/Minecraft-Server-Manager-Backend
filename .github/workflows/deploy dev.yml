name: deploy development
on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
    branches:
      - main

jobs:
  deploy:
    runs-on: [self-hosted, Windows]
    environment: development
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build project
        run: mvn clean install

      - name: Deploy to development
        run: echo "Deploying to development environment..."
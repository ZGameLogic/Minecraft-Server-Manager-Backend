name: deploy production
on:
  release:
    types: [published]

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Build project
        run: mvn clean package

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          retention-days: 5
          name: minecraft-server-manager-backend.jar
          path: target/minecraft-server-manager-backend-*.jar

  disable-monitor:
    uses: zgamelogic/github-actions/.github/workflows/monitor-status.yaml@v1.0.2
    needs: [ build-and-upload ]
    with:
      applicationId: 53
      monitorId: '55'
      active: false

  deploy:
    needs: [ build-and-upload, disable-monitor ]
    runs-on: [self-hosted, Windows]
    environment: production
    steps:
      - name: Download jar
        uses: actions/download-artifact@v7
        with:
          name: minecraft-server-manager-backend.jar

      - name: Shutdown Service
        run: C:\Users\Ben\Desktop\nssm.exe stop "Minecraft Server Manager"

      - name: delete old jar
        run: del "C:\Users\Ben\Minecraft Server Manager\minecraft-server-manager-backend.jar"

      - name: copy new jar
        run: copy minecraft-server-manager-backend-* "C:\Users\Ben\Minecraft Server Manager\minecraft-server-manager-backend.jar"

      - name: Start Service
        run: C:\Users\Ben\Desktop\nssm.exe start "Minecraft Server Manager"

  enable-monitor:
    uses: zgamelogic/github-actions/.github/workflows/monitor-status.yaml@v1.0.2
    if: ${{ !cancelled() && needs.disable-monitor.result == 'success' }}
    needs: [ deploy, disable-monitor ]
    with:
      applicationId: 53
      monitorId: '55'
      active: true
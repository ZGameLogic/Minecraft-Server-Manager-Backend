<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Login Successful</title>
        <style>
            body {
                background-color: #181818;
                color: #f1f1f1;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                margin: 0;
                font-family: Arial, sans-serif;
            }
            .message {
                font-size: 1.5rem;
                text-align: center;
                padding: 2rem;
                background: #222;
                border-radius: 8px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.5);
                max-width: 640px;
                width: min(90vw, 640px);
            }
            .code-box {
                margin-top: 1rem;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.75rem;
                background: #111;
                border: 1px solid #333;
                border-radius: 8px;
                padding: 0.75rem 0.9rem;
                text-align: left;
            }
            .code-value {
                margin: 0;
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
                font-size: 1rem;
                word-break: break-all;
                color: #d6f5d6;
                flex: 1;
            }
            .copy-btn {
                border: 1px solid #555;
                background: #2d2d2d;
                color: #f1f1f1;
                border-radius: 6px;
                padding: 0.45rem 0.7rem;
                font-size: 0.85rem;
                cursor: pointer;
                transition: background 0.15s ease, border-color 0.15s ease;
                white-space: nowrap;
            }
            .copy-btn:hover {
                background: #3a3a3a;
                border-color: #666;
            }
            .copy-btn:active {
                background: #1f1f1f;
            }
        </style>
    </head>
    <body>
        <div class="message">
            <p>Unless you are using the Terminal UI for MSM, you may close this tab.</p>
            <div class="code-box">
                <p id="authCode" class="code-value" th:text="${code}"></p>
                <button id="copyBtn" class="copy-btn" type="button">Copy</button>
            </div>
        </div>
        <script>
            const copyBtn = document.getElementById("copyBtn");
            const authCode = document.getElementById("authCode");

            copyBtn.addEventListener("click", async () => {
                const text = (authCode?.textContent || "").trim();
                if (!text) {
                    return;
                }

                try {
                    await navigator.clipboard.writeText(text);
                    copyBtn.textContent = "Copied!";
                    copyBtn.classList.add("copied");
                    setTimeout(() => {
                        copyBtn.textContent = "Copy";
                        copyBtn.classList.remove("copied");
                    }, 1200);
                } catch {
                    copyBtn.textContent = "Failed";
                    setTimeout(() => {
                        copyBtn.textContent = "Copy";
                    }, 1200);
                }
            });
        </script>
    </body>
</html>
